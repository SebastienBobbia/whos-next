[package]
name = "whos-next"
version = "2.0.0"
description = "Suivi des prises de parole pendant le daily"
authors = ["Loklas"]
edition = "2021"

[lib]
# Le suffixe `_lib` évite un conflit de nom avec le binaire sous Windows.
name = "whos_next_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Voir https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
